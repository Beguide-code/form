<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form project</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="content1">
        <img src="odin-lined.png" alt="" />
        <p>ODIN</p>
      </div>
      <div class="content2">
        <div class="text">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem unde <br>
          quisquam debitis libero sapiente nihil doloremque nulla ipsum <br>
          architecto  <br>
          <br>
          Lorem ipsum dolor sit amet.
        </div>
        <form action="#" class="form">
            <p>Let's do this!</p>
            <div class="item">
                <div class="row1">
                    <div>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" placeholder="Bob..." name="first-name">
                    </div>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="Marcelo@gmail.com" name="email">
                    </div>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>
                <div class="row2">
                    <div><label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" placeholder="Oscar..." name="last-name">
                    </div>
                    <div>
                        <label for="phone-number">EMAIL</label>
                        <input type="tel" id="phone-number" placeholder="50389" name="phone-number">
                    </div>
                    <div>
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>
            </div>
        </form>
        <div class="bottom">
            <button type="submit">Create Account</button>
            <p>Already have an account? <span>Log in</span></p>
        </div>
        
      </div>
    </div>
  </body>
</html>
